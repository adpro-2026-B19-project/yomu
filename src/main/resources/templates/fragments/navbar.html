<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
</head>
<body>
    <header class="site-header" th:fragment="navbar">
        <div class="site-shell site-nav">
            <a class="site-brand" th:href="@{/}">
                <span class="site-brand-mark">Y</span>
                <span>Yomu</span>
            </a>
            <nav class="nav-links">
                <a class="nav-link" th:href="@{/texts}">Library</a>
                <a class="nav-link" th:href="@{/leaderboard}">Leaderboard</a>
                <a class="nav-link" th:href="@{/clans}">League</a>
                <a class="nav-link" th:href="@{/achievements}">Achievements</a>
                <a class="nav-link" th:href="@{/profile}">Profile</a>
                
                <span sec:authorize="isAuthenticated()" sec:authentication="name" class="nav-link" style="font-weight: bold; cursor: default;">Username</span>
                
                <form sec:authorize="isAuthenticated()" th:action="@{/auth/logout}" method="post" style="margin:0;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="button button-secondary">Log out</button>
                </form>
                
                <a sec:authorize="!isAuthenticated()" class="button button-primary" th:href="@{/auth/login}">Log in</a>
            </nav>
        </div>
    </header>
</body>
</html>
