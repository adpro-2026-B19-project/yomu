<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="site-header" th:fragment="siteNav">
    <div class="site-shell site-nav">
        <a class="site-brand" th:href="@{/}">
            <span class="site-brand-mark">Y</span>
            <span>Yomu</span>
        </a>
        <nav class="nav-links">
            <th:block th:if="${loggedInName != null and !#strings.isEmpty(loggedInName)}">
                <a class="nav-link"
                   th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/texts') and !#strings.startsWith(currentPath, '/texts/history')} ? ' active' : ''"
                   th:href="@{/texts}">Library</a>
                <a class="nav-link"
                   th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/leaderboard')} ? ' active' : ''"
                   th:href="@{/leaderboard(tier='BRONZE')}">Leaderboard</a>
                <a class="nav-link"
                   th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/clans')} ? ' active' : ''"
                   th:href="@{/clans}">League</a>
                <a class="nav-link"
                   th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/achievements')} ? ' active' : ''"
                   th:href="@{/achievements}">Achievements</a>
                <a class="nav-link"
                   th:classappend="${currentPath == '/texts/history'} ? ' active' : ''"
                   th:href="@{/texts/history}">History</a>
                <a class="nav-link"
                   th:classappend="${currentPath != null and (#strings.startsWith(currentPath, '/profile') or #strings.startsWith(currentPath, '/users/') or #strings.startsWith(currentPath, '/players/'))} ? ' active' : ''"
                   th:href="${profileNavHref}">Profile</a>
                <span class="user-pill" th:text="${loggedInName}">reader</span>
                <form th:action="@{/auth/logout}"
                      method="post"
                      style="margin:0;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="button button-secondary">Log out</button>
                </form>
            </th:block>
            <th:block th:unless="${loggedInName != null and !#strings.isEmpty(loggedInName)}">
                <a th:href="@{/auth/login}"
                   class="button button-secondary">Log in</a>
                <a th:href="@{/auth/register}"
                   class="button button-primary">Create account</a>
            </th:block>
        </nav>
    </div>
</header>
</body>
</html>
