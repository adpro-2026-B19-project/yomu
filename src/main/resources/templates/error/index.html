<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Yomu - Error</title>
    <link rel="stylesheet" th:href="@{/css/yomu-clay.css}"/>
</head>
<body>
<main class="result-shell">
    <section class="result-card">
        <span class="eyebrow" style="justify-self:center;">Request error</span>
        <div class="placeholder-art" style="min-height:180px;">
            <div class="hero-stack" style="justify-content:center;">
                <div class="surface-card" style="max-width:240px;">
                    <strong>That page is not available right now.</strong>
                    <p class="muted tiny" style="margin-top:8px;">Return to a stable route and continue from there.</p>
                </div>
            </div>
        </div>
        <h1 class="page-title" th:text="${errorTitle} ?: 'Something went wrong'">Something went wrong</h1>
        <p class="page-lead" th:text="${errorMessage} ?: 'The page could not be opened or you do not have access to it.'">The page could not be found.</p>
        <span class="caption">Error code: <span th:text="${status} ?: 'Unknown'">404</span></span>
        <div class="form-actions" style="justify-content:center;">
            <a th:href="@{/}" class="button button-primary">Return home</a>
            <button onclick="history.back()" class="button button-secondary">Go back</button>
        </div>
    </section>
</main>
</body>
</html>
