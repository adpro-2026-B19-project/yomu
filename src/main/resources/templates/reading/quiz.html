<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz - Yomu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --canvas: #fffaf0;
            --surface-soft: #faf5e8;
            --surface-card: #f5f0e0;
            --surface-strong: #ebe6d6;
            --hairline: #e5dcc8;
            --ink: #0a0a0a;
            --muted: #6a6a6a;
            --teal: #1a3a3a;
            --teal-dark: #102525;
            --teal-soft: rgba(26, 58, 58, 0.08);
            --lavender: #b8a4ed;
            --coral: #ff6b5a;
            --coral-dark: #e25848;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(255, 176, 132, 0.18), transparent 25%),
                radial-gradient(circle at top right, rgba(184, 164, 237, 0.18), transparent 30%),
                var(--canvas);
            color: var(--ink);
            padding-bottom: 118px;
        }

        .container {
            width: min(820px, 92vw);
            margin: 0 auto;
            padding-top: 34px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 42px;
        }

        .close-btn {
            color: var(--muted);
            font-size: 34px;
            line-height: 1;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s ease;
        }

        .close-btn:hover {
            color: var(--ink);
        }

        .progress-wrapper {
            flex-grow: 1;
            background: var(--surface-strong);
            height: 16px;
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid rgba(229, 220, 200, 0.95);
        }

        .progress-bar {
            height: 100%;
            background: var(--teal);
            border-radius: 999px;
            width: 0%;
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12);
        }

        .lives {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--coral);
            font-weight: 800;
            font-size: 18px;
        }

        .heart-icon {
            font-size: 22px;
        }

        .quiz-content {
            display: flex;
            flex-direction: column;
            gap: 22px;
            animation: fadeIn 0.25s forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-shell {
            padding: 28px;
            border-radius: 28px;
            background: rgba(255, 252, 246, 0.94);
            border: 1px solid rgba(229, 220, 200, 0.95);
            box-shadow: 0 18px 48px rgba(26, 20, 8, 0.08);
        }

        .badge-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .badge-icon {
            background: rgba(184, 164, 237, 0.85);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        .badge-text {
            color: #6b57ad;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .question-text {
            font-family: "Space Grotesk", "Inter", sans-serif;
            font-size: clamp(2rem, 5vw, 2.25rem);
            font-weight: 500;
            margin: 0;
            line-height: 1.2;
        }

        .options-grid {
            display: grid;
            gap: 14px;
            margin-top: 34px;
        }

        .option-card {
            border: 2px solid var(--hairline);
            border-bottom-width: 4px;
            background: rgba(255, 255, 255, 0.76);
            padding: 16px 18px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
            user-select: none;
        }

        .option-card:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-1px);
        }

        .option-card:active {
            border-bottom-width: 2px;
            transform: translateY(2px);
        }

        .option-card.selected {
            border-color: var(--teal);
            background: var(--teal-soft);
        }

        .option-number {
            border: 2px solid var(--hairline);
            width: 34px;
            min-width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            color: var(--muted);
            font-size: 14px;
        }

        .option-card.selected .option-number {
            border-color: var(--teal);
            color: var(--teal);
        }

        .bottom-drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            border-top: 1px solid rgba(229, 220, 200, 0.95);
            background: rgba(250, 245, 232, 0.98);
            padding: 22px 0;
            transition: background 0.25s ease;
            z-index: 100;
        }

        .bottom-drawer.correct {
            background: rgba(164, 212, 197, 0.18);
        }

        .bottom-drawer.incorrect {
            background: rgba(255, 107, 90, 0.12);
        }

        .drawer-inner {
            width: min(820px, 92vw);
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .feedback {
            display: flex;
            align-items: center;
            gap: 16px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
            transition: 0.25s ease;
        }

        .bottom-drawer.correct .feedback,
        .bottom-drawer.incorrect .feedback {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .feedback-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
            background: white;
        }

        .bottom-drawer.correct .feedback-icon {
            background: var(--teal);
            color: white;
        }

        .bottom-drawer.incorrect .feedback-icon {
            background: var(--coral);
            color: white;
        }

        .feedback-texts h2 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 800;
        }

        .bottom-drawer.correct .feedback-texts h2 {
            color: var(--teal);
        }

        .bottom-drawer.incorrect .feedback-texts h2 {
            color: var(--coral);
        }

        .correct-answer-label {
            color: var(--coral);
            font-size: 0.92rem;
            font-weight: 700;
            margin-top: 6px;
            display: none;
        }

        .bottom-drawer.incorrect .correct-answer-label {
            display: block;
        }

        .action-btn {
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 0.92rem;
            font-weight: 800;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            background: var(--surface-strong);
            color: var(--muted);
            min-width: 180px;
            transition: 0.2s ease;
            letter-spacing: 0.08em;
            font-family: inherit;
        }

        .action-btn.green {
            background: var(--ink);
            color: white;
            border-bottom: 4px solid var(--teal-dark);
            transform: translateY(-2px);
        }

        .action-btn.green:active {
            transform: translateY(2px);
            border-bottom-width: 0;
            margin-top: 4px;
        }

        .action-btn.red {
            background: var(--coral);
            color: white;
            border-bottom: 4px solid var(--coral-dark);
            transform: translateY(-2px);
        }

        .action-btn.red:active {
            transform: translateY(2px);
            border-bottom-width: 0;
            margin-top: 4px;
        }

        .empty-state {
            text-align: center;
            color: var(--muted);
            padding: 40px;
            border: 2px dashed var(--hairline);
            border-radius: 24px;
            font-weight: 700;
            background: rgba(250, 245, 232, 0.82);
        }

        @media (max-width: 760px) {
            body {
                padding-bottom: 154px;
            }

            .top-bar {
                gap: 14px;
                margin-bottom: 30px;
            }

            .question-shell {
                padding: 22px;
            }

            .drawer-inner {
                flex-direction: column;
                align-items: stretch;
            }

            .feedback {
                width: 100%;
            }

            .action-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="top-bar">
            <a th:href="@{/texts/{id}(id=${text.id})}" class="close-btn" title="Back">&times;</a>
            <div class="progress-wrapper">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="lives">
                <span class="heart-icon">&#10084;</span> <span id="lives-count">5</span>
            </div>
        </div>

        <div th:if="${param.error != null}" class="alert error" style="margin-bottom: 22px; padding: 15px; background-color: #ffebd6; border-left: 5px solid #ff6b5a; color: #b22222; border-radius: 8px;">
            <strong>Error:</strong>
            <span th:text="${param.error}">Error message</span>
        </div>

        <div id="js-error-banner" class="alert error" style="display:none; margin-bottom: 22px; padding: 15px; background-color: #ffebd6; border-left: 5px solid #ff6b5a; color: #b22222; border-radius: 8px;">
            <strong>Error:</strong> <span id="js-error-message"></span>
        </div>

        <div id="quiz-root"></div>

        <div th:if="${#lists.isEmpty(questions)}" class="empty-state">
            <p>This text does not have a quiz yet. Ask an admin to add one.</p>
            <a th:href="@{/texts/{id}(id=${text.id})}" style="color: var(--teal); text-decoration: none;">Back to text</a>
        </div>
    </div>

    <div class="bottom-drawer" id="bottom-drawer">
        <div class="drawer-inner">
            <div class="feedback">
                <div class="feedback-icon" id="feedback-icon">OK</div>
                <div class="feedback-texts">
                    <h2 id="feedback-title">Correct.</h2>
                    <div class="correct-answer-label" id="feedback-desc"></div>
                </div>
            </div>
            <button id="action-btn" class="action-btn" disabled>Check</button>
        </div>
    </div>

    <form id="submit-form" th:action="@{/texts/{id}/quiz/submit(id=${text.id})}" method="post" style="display:none;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    </form>

    <script th:inline="javascript">
        const questionsData = [];
        /*[# th:each="q : ${questions}"]*/
        (function () {
            const opts = [];
            /*[# th:each="opt : ${q.options}"]*/
            opts.push({
                id: /*[[${opt.id}]]*/ 0,
                text: /*[[${opt.text}]]*/ '',
                correct: /*[[${opt.correct}]]*/ false
            });
            /*[/]*/
            questionsData.push({
                id: /*[[${q.id}]]*/ 0,
                text: /*[[${q.question}]]*/ '',
                options: opts
            });
        })();
        /*[/]*/

        const MIN_LIVES = 0;

        let currentIdx = 0;
        let lives = 5;
        let state = 'waiting';
        let selectedOptionId = null;
        let answersMap = {};

        const root = document.getElementById('quiz-root');
        const progressBar = document.getElementById('progress-bar');
        const livesCountEl = document.getElementById('lives-count');
        const actionBtn = document.getElementById('action-btn');
        const bottomDrawer = document.getElementById('bottom-drawer');
        const feedbackIcon = document.getElementById('feedback-icon');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackDesc = document.getElementById('feedback-desc');

        function showInformativeError(message) {
            const banner = document.getElementById('js-error-banner');
            const msgSpan = document.getElementById('js-error-message');
            if (banner && msgSpan) {
                msgSpan.textContent = message;
                banner.style.display = 'block';
                banner.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function hideInformativeError() {
            const banner = document.getElementById('js-error-banner');
            if (banner) {
                banner.style.display = 'none';
            }
        }

        window.addEventListener('offline', () => {
            showInformativeError("Connection lost. Please check your internet connection.");
        });

        window.addEventListener('online', () => {
            hideInformativeError();
        });

        function init() {
            if (!questionsData || questionsData.length === 0) {
                bottomDrawer.style.display = 'none';
                return;
            }
            updateProgress();
            renderQuestion();
        }

        function updateProgress() {
            if (questionsData.length > 0) {
                const percentage = (currentIdx / questionsData.length) * 100;
                progressBar.style.width = percentage + '%';
            }
            livesCountEl.textContent = lives;
        }

        function renderQuestion() {
            root.innerHTML = '';
            state = 'waiting';
            selectedOptionId = null;

            const q = questionsData[currentIdx];

            let html = `
            <div class="quiz-content" id="qc-${q.id}">
                <div class="question-shell">
                    <div class="badge-container">
                        <div class="badge-icon">Q</div>
                        <span class="badge-text">Question ${currentIdx + 1}</span>
                    </div>
                    <h1 class="question-text">${q.text}</h1>

                    <div class="options-grid">
            `;

            q.options.forEach((opt, idx) => {
                html += `
                <div class="option-card" id="opt-${opt.id}" onclick="selectOption(${opt.id})">
                    <div class="option-number">${idx + 1}</div>
                    <span>${opt.text}</span>
                </div>
            `;
            });

            html += `
                    </div>
                </div>
            </div>
        `;

            root.innerHTML = html;
            resetDrawer();
        }

        function selectOption(optId) {
            if (state === 'checked') return;

            selectedOptionId = optId;

            document.querySelectorAll('.option-card').forEach(el => el.classList.remove('selected'));
            document.getElementById(`opt-${optId}`).classList.add('selected');

            actionBtn.disabled = false;
            actionBtn.classList.add('green');
            actionBtn.textContent = 'Check';
        }

        function checkAnswer() {
            const q = questionsData[currentIdx];
            const selected = q.options.find(o => o.id === selectedOptionId);

            state = 'checked';
            actionBtn.textContent = 'Continue';
            actionBtn.classList.remove('green');

            if (selected && selected.correct) {
                answersMap[q.id] = selectedOptionId;
                bottomDrawer.className = 'bottom-drawer correct';
                feedbackIcon.textContent = 'OK';
                feedbackTitle.textContent = 'Correct.';
                feedbackDesc.textContent = '';
                actionBtn.classList.add('green');
            } else {
                lives--;
                updateProgress();

                const correctOpt = q.options.find(o => o.correct);
                bottomDrawer.className = 'bottom-drawer incorrect';
                feedbackIcon.textContent = 'X';
                feedbackTitle.textContent = 'Not quite.';
                feedbackDesc.textContent = `Correct answer: ${correctOpt ? correctOpt.text : ''}`;
                actionBtn.classList.add('red');
            }
        }

        function proceedNext() {
            currentIdx++;

            if (lives <= MIN_LIVES || currentIdx >= questionsData.length) {
                submitQuiz();
            } else {
                updateProgress();
                renderQuestion();
            }
        }

        function resetDrawer() {
            bottomDrawer.className = 'bottom-drawer';
            actionBtn.disabled = true;
            actionBtn.classList.remove('green', 'red');
            actionBtn.textContent = 'Check';
        }

        function submitQuiz() {
            if (!navigator.onLine) {
                showInformativeError("Cannot submit quiz. You are currently offline. Please check your network connection and try again.");
                return;
            }

            progressBar.style.width = '100%';
            actionBtn.disabled = true;
            actionBtn.textContent = 'Submitting...';

            const form = document.getElementById('submit-form');

            for (const [qId, optId] of Object.entries(answersMap)) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = `question_${qId}`;
                input.value = optId;
                form.appendChild(input);
            }

            form.submit();
        }

        actionBtn.addEventListener('click', () => {
            if (state === 'waiting' && selectedOptionId) {
                checkAnswer();
            } else if (state === 'checked') {
                proceedNext();
            }
        });

        init();
    </script>
</body>
</html>
