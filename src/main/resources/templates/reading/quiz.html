<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz - Yomu</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #131F24;
            --text-white: #FFFFFF;
            --panel-dark: #202F36;
            --btn-gray: #3A464D;
            --border: #3A464D;

            --green: #58CC02;
            --green-dark: #58A700;

            --blue: #1CB0F6;
            --blue-dark: #1899D6;
            --blue-bg: rgba(28, 176, 246, 0.1);

            --red: #FF4B4B;
            --red-dark: #EA2B2B;

            --purple: #CE82FF;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Nunito', sans-serif;
            background: var(--bg-dark);
            color: var(--text-white);
            padding-bottom: 120px;
        }

        .container {
            width: min(800px, 92vw);
            margin: 0 auto;
            padding-top: 30px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 50px;
        }

        .close-btn {
            color: #AFB8BB;
            font-size: 38px;
            line-height: 1;
            text-decoration: none;
            font-weight: 900;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: white;
        }

        .progress-wrapper {
            flex-grow: 1;
            background: var(--btn-gray);
            height: 18px;
            border-radius: 12px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--green);
            border-radius: 12px;
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.15);
        }

        .lives {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--red);
            font-weight: 900;
            font-size: 20px;
        }

        .heart-icon {
            font-size: 24px;
            animation: pump 1s ease-in-out infinite alternate;
        }

        @keyframes pump {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.1);
            }
        }

        .quiz-content {
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .badge-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .badge-icon {
            background: var(--purple);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .badge-text {
            color: var(--purple);
            font-weight: 900;
            font-size: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .question-text {
            font-size: 32px;
            font-weight: 800;
            margin: 0;
            line-height: 1.3;
        }

        /* Options */
        .options-grid {
            display: grid;
            gap: 16px;
            margin-top: 40px;
        }

        .option-card {
            border: 2px solid var(--border);
            border-bottom-width: 4px;
            background: var(--bg-dark);
            padding: 16px 20px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            transition: all 0.2s;
            user-select: none;
        }

        .option-card:hover {
            background: rgba(255, 255, 255, 0.03);
            transform: translateY(-1px);
        }

        .option-card:active {
            border-bottom-width: 2px;
            transform: translateY(2px);
        }

        .option-card.selected {
            border-color: var(--blue);
            background: var(--blue-bg);
        }

        .option-number {
            border: 2px solid var(--border);
            width: 32px;
            min-width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            margin-right: 16px;
            color: #AFB8BB;
            font-size: 14px;
        }

        .option-card.selected .option-number {
            border-color: var(--blue);
            color: var(--blue);
        }

        .bottom-drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            border-top: 2px solid var(--border);
            background: var(--bg-dark);
            padding: 24px 0;
            transition: background 0.3s;
            z-index: 100;
        }

        .bottom-drawer.correct {
            background: var(--panel-dark);
        }

        .bottom-drawer.incorrect {
            background: var(--panel-dark);
        }

        .drawer-inner {
            width: min(800px, 92vw);
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .feedback {
            display: flex;
            align-items: center;
            gap: 20px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
            transition: 0.3s;
        }

        .bottom-drawer.correct .feedback,
        .bottom-drawer.incorrect .feedback {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .feedback-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 900;
            background: white;
        }

        .bottom-drawer.correct .feedback-icon {
            background: var(--green);
            color: white;
        }

        .bottom-drawer.incorrect .feedback-icon {
            background: var(--red);
            color: white;
        }

        .feedback-texts h2 {
            margin: 0;
            font-size: 26px;
            font-weight: 900;
        }

        .bottom-drawer.correct .feedback-texts h2 {
            color: var(--green);
        }

        .bottom-drawer.incorrect .feedback-texts h2 {
            color: var(--red);
        }

        .correct-answer-label {
            color: var(--red);
            font-size: 16px;
            font-weight: 800;
            margin-top: 6px;
            display: none;
        }

        .bottom-drawer.incorrect .correct-answer-label {
            display: block;
        }

        .action-btn {
            padding: 16px 36px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            background: var(--btn-gray);
            color: #AFB8BB;
            min-width: 180px;
            transition: 0.2s;
            letter-spacing: 1px;
            font-family: inherit;
        }

        .action-btn.green {
            background: var(--green);
            color: white;
            border-bottom: 4px solid var(--green-dark);
            transform: translateY(-2px);
        }

        .action-btn.green:active {
            transform: translateY(2px);
            border-bottom-width: 0;
            margin-top: 4px;
        }

        .action-btn.red {
            background: var(--red);
            color: white;
            border-bottom: 4px solid var(--red-dark);
            transform: translateY(-2px);
        }

        .action-btn.red:active {
            transform: translateY(2px);
            border-bottom-width: 0;
            margin-top: 4px;
        }

        /* Helpers */
        .empty-state {
            text-align: center;
            color: #AFB8BB;
            padding: 40px;
            border: 2px dashed var(--border);
            border-radius: 16px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="top-bar">
            <a th:href="@{/texts/{id}(id=${text.id})}" class="close-btn" title="Keluar">&times;</a>
            <div class="progress-wrapper">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="lives">
                <span class="heart-icon">❤️</span> <span id="lives-count">5</span>
            </div>
        </div>

        <div id="quiz-root">
        </div>

        <div th:if="${#lists.isEmpty(questions)}" class="empty-state">
            <p>Maaf, belum ada soal kuis untuk bacaan ini. Hubungi admin.</p>
            <a th:href="@{/texts/{id}(id=${text.id})}" style="color: var(--blue); text-decoration: none;">Kembali ke
                Bacaan</a>
        </div>
    </div>

    <div class="bottom-drawer" id="bottom-drawer">
        <div class="drawer-inner">
            <div class="feedback">
                <div class="feedback-icon" id="feedback-icon">✓</div>
                <div class="feedback-texts">
                    <h2 id="feedback-title">Bagus!</h2>
                    <div class="correct-answer-label" id="feedback-desc"></div>
                </div>
            </div>
            <button id="action-btn" class="action-btn" disabled>PERIKSA</button>
        </div>
    </div>

    <form id="submit-form" th:action="@{/texts/{id}/quiz/submit(id=${text.id})}" method="post" style="display:none;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    </form>

    <script th:inline="javascript">
        const questionsData = [];
        /*[# th:each="q : ${questions}"]*/
        (function () {
            const opts = [];
            /*[# th:each="opt : ${q.options}"]*/
            opts.push({
                id: /*[[${opt.id}]]*/ 0,
                text: /*[[${opt.text}]]*/ '',
                correct: /*[[${opt.correct}]]*/ false
            });
            /*[/]*/
            questionsData.push({
                id: /*[[${q.id}]]*/ 0,
                text: /*[[${q.question}]]*/ '',
                options: opts
            });
        })();
        /*[/]*/

        const MIN_LIVES = 0;

        // State
        let currentIdx = 0;
        let lives = 5;
        let state = 'waiting'; // 'waiting', 'checked'
        let selectedOptionId = null;
        let answersMap = {}; // store question_id -> Option_id

        const root = document.getElementById('quiz-root');
        const progressBar = document.getElementById('progress-bar');
        const livesCountEl = document.getElementById('lives-count');
        const actionBtn = document.getElementById('action-btn');
        const bottomDrawer = document.getElementById('bottom-drawer');
        const feedbackIcon = document.getElementById('feedback-icon');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackDesc = document.getElementById('feedback-desc');

        function init() {
            if (!questionsData || questionsData.length === 0) {
                bottomDrawer.style.display = 'none';
                return;
            }
            updateProgress();
            renderQuestion();
        }

        function updateProgress() {
            if (questionsData.length > 0) {
                const percentage = (currentIdx / questionsData.length) * 100;
                progressBar.style.width = percentage + '%';
            }
            livesCountEl.textContent = lives;
        }

        function renderQuestion() {
            root.innerHTML = '';
            state = 'waiting';
            selectedOptionId = null;

            const q = questionsData[currentIdx];

            let html = `
            <div class="quiz-content" id="qc-${q.id}">
                <div class="badge-container">
                    <div class="badge-icon"><div style="color: white; font-weight:bold; font-size:12px;">★</div></div>
                    <span class="badge-text">PERTANYAAN NO ${currentIdx + 1}</span>
                </div>
                <h1 class="question-text">${q.text}</h1>
                
                <div class="options-grid">
        `;

            q.options.forEach((opt, idx) => {
                html += `
                <div class="option-card" id="opt-${opt.id}" onclick="selectOption(${opt.id})">
                    <div class="option-number">${idx + 1}</div>
                    <span>${opt.text}</span>
                </div>
            `;
            });

            html += `
                </div>
            </div>
        `;

            root.innerHTML = html;
            resetDrawer();
        }

        function selectOption(optId) {
            if (state === 'checked') return;

            selectedOptionId = optId;

            document.querySelectorAll('.option-card').forEach(el => el.classList.remove('selected'));
            document.getElementById(`opt-${optId}`).classList.add('selected');

            actionBtn.disabled = false;
            actionBtn.classList.add('green');
            actionBtn.textContent = 'PERIKSA';
        }

        function checkAnswer() {
            const q = questionsData[currentIdx];
            const selected = q.options.find(o => o.id === selectedOptionId);

            state = 'checked';
            actionBtn.textContent = 'LANJUTKAN';
            actionBtn.classList.remove('green');

            if (selected && selected.correct) {
                answersMap[q.id] = selectedOptionId;
                bottomDrawer.className = 'bottom-drawer correct';
                feedbackIcon.innerHTML = '✓';
                feedbackTitle.textContent = 'Bagus sekali!';
                actionBtn.classList.add('green');
            } else {
                lives--;
                updateProgress();

                const correctOpt = q.options.find(o => o.correct);
                bottomDrawer.className = 'bottom-drawer incorrect';
                feedbackIcon.innerHTML = '✕';
                feedbackTitle.textContent = 'Salah!';
                feedbackDesc.textContent = `Jawaban yang benar: ${correctOpt ? correctOpt.text : ''}`;
                actionBtn.classList.add('red');
            }
        }

        function proceedNext() {
            currentIdx++;

            if (lives <= MIN_LIVES || currentIdx >= questionsData.length) {
                submitQuiz();
            } else {
                updateProgress();
                renderQuestion();
            }
        }

        function resetDrawer() {
            bottomDrawer.className = 'bottom-drawer';
            actionBtn.disabled = true;
            actionBtn.classList.remove('green', 'red');
            actionBtn.textContent = 'PERIKSA';
        }

        function submitQuiz() {
            progressBar.style.width = '100%';
            actionBtn.disabled = true;
            actionBtn.textContent = 'MEMPROSES...';

            const form = document.getElementById('submit-form');

            for (const [qId, optId] of Object.entries(answersMap)) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = `question_${qId}`;
                input.value = optId;
                form.appendChild(input);
            }

            form.submit();
        }

        actionBtn.addEventListener('click', () => {
            if (state === 'waiting' && selectedOptionId) {
                checkAnswer();
            } else if (state === 'checked') {
                proceedNext();
            }
        });

        init();
    </script>

</body>

</html>
