<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Yomu - Quiz Result</title>
    <link rel="stylesheet" th:href="@{/css/yomu-clay.css}"/>
</head>
<body>
<main class="result-shell">
    <section class="result-card">
        <span class="eyebrow" style="justify-self:center;">Quiz result</span>
        <h1 class="page-title">Kuis Selesai!</h1>
        <p class="page-lead" style="margin:0 auto;">This score is now part of your reading history, achievement progress, and league contribution.</p>

        <div class="result-score">
            <span class="caption">Final score</span>
            <strong th:text="${#numbers.formatDecimal(attempt.score, 0, 0)}">100</strong>
            <span class="muted">Accuracy <span th:text="${#numbers.formatDecimal(attempt.accuracy * 100, 0, 0)}">100</span>%</span>
        </div>

        <div class="form-actions" style="justify-content:center;">
            <a th:href="@{/texts/{id}(id=${textId})}" class="button button-primary">Back to text</a>
            <a th:href="@{/texts/history}" class="button button-secondary">Open history</a>
        </div>
    </section>
</main>
</body>
</html>
