<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Hasil Kuis - Yomu</title>
    <style>
        :root{ --primary:#3B82F6; --accent:#F59E0B; --bg:#0F172A; --card:#1E293B; --border:#334155; --text:#E2E8F0; --muted:#94A3B8; --success:#34D399; }
        *{box-sizing:border-box;}
        body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text); display:flex; align-items:center; justify-content:center; min-height:100vh;}
        
        .result-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 40px 30px; text-align: center; width: min(500px, 90vw); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .icon { font-size: 64px; margin-bottom: 20px; }
        .title { font-size: 28px; font-weight: 800; margin: 0 0 10px; }
        
        .score-box { background: rgba(52, 211, 153, 0.1); border: 1px solid rgba(52, 211, 153, 0.3); padding: 20px; border-radius: 16px; margin: 30px 0; }
        .score-val { font-size: 48px; font-weight: 900; color: var(--success); line-height: 1; margin-bottom: 5px; }
        .score-label { color: var(--success); font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        
        .btn { display: inline-block; padding: 14px 24px; border-radius: 12px; background: var(--primary); color: #fff; font-weight: 700; text-decoration: none; transition: 0.2s; width: 100%; }
        .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="result-card">
    <div class="icon">🏆</div>
    <h1 class="title">Kuis Selesai!</h1>
    <p style="color: var(--muted); margin: 0; font-size: 16px;">Skormu telah disimpan dan dikirim ke sistem Liga dan Achivement.</p>
    
    <div class="score-box">
        <div class="score-val" th:text="${#numbers.formatDecimal(attempt.score, 0, 0)}">100</div>
        <div class="score-label">Skor Benar</div>
        <div style="font-size: 14px; margin-top: 10px; color: var(--text);">
            Akurasi: <span th:text="${#numbers.formatDecimal(attempt.accuracy * 100, 0, 0)}">100</span>%
        </div>
    </div>
    
    <a th:href="@{/texts/{id}(id=${textId})}" class="btn">Kembali ke Teks</a>
</div>

</body>
</html>
