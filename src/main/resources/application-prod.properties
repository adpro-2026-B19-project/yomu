# Spring Boot Actuator - Production Configuration
# Expose only safe endpoints for monitoring and health checks
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Disable dangerous endpoints
management.endpoints.web.exposure.exclude=env,beans,configprops,heapdump,threaddump,loggers,shutdown

# Metrics configuration
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Prometheus metrics
management.endpoints.web.path-mapping.prometheus=prometheus
