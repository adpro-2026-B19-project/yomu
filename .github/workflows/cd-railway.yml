name: Railway Deploy

on:
  workflow_run:
    workflows:
      - CI Quality Gate
    types:
      - completed
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  blocked-by-quality-gate:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'staging' && github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain why deployment is blocked
        run: |
          echo "CI did not pass quality checks. Railway deployment is blocked."
          echo "Trigger event: ${{ github.event.workflow_run.event }}"
          echo "Trigger branch: ${{ github.event.workflow_run.head_branch }}"
          echo "CI conclusion: ${{ github.event.workflow_run.conclusion }}"

  deploy:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'staging' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE || secrets.RAILWAY_SERVICE }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || secrets.RAILWAY_ENVIRONMENT || 'production' }}
      RAILWAY_PUBLIC_URL: ${{ vars.RAILWAY_PUBLIC_URL || secrets.RAILWAY_PUBLIC_URL }}
      RAILWAY_DB_PASSWORD: ${{ secrets.RAILWAY_DB_PASSWORD }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      APP_DEMO_SEED: ${{ vars.APP_DEMO_SEED || secrets.APP_DEMO_SEED || 'true' }}
      SESSION_TIMEOUT: ${{ vars.SESSION_TIMEOUT || secrets.SESSION_TIMEOUT || '15m' }}
    steps:
      - name: Checkout repository at tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate deployment configuration
        shell: bash
        run: |
          required_vars=(
            RAILWAY_TOKEN
            RAILWAY_SERVICE
            RAILWAY_ENVIRONMENT
            RAILWAY_PUBLIC_URL
            RAILWAY_DB_PASSWORD
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
          )

          missing=0
          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name}" ]; then
              echo "::error title=Missing deployment configuration::$var_name is required for Railway deployment."
              missing=1
            fi
          done

          if [ "$APP_DEMO_SEED" != "true" ] && [ "$APP_DEMO_SEED" != "false" ]; then
            echo "::error title=Invalid deployment configuration::APP_DEMO_SEED must be either true or false."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Show Railway CLI version
        run: railway --version

      - name: Sync production variables to Railway
        shell: bash
        run: |
          public_url="${RAILWAY_PUBLIC_URL%/}"
          railway variables set \
            "SPRING_PROFILES_ACTIVE=docker" \
            "DB_USERNAME=yomu" \
            "DB_PASSWORD=${RAILWAY_DB_PASSWORD}" \
            "APP_DEMO_SEED=${APP_DEMO_SEED}" \
            "GOOGLE_OAUTH_ENABLED=true" \
            "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" \
            "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" \
            "APP_OAUTH2_GOOGLE_REDIRECT_URI=${public_url}/login/oauth2/code/google" \
            "SESSION_TIMEOUT=${SESSION_TIMEOUT}" \
            --service "$RAILWAY_SERVICE" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --skip-deploys

      - name: Deploy tested commit to Railway
        run: railway up --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" --ci

      - name: Smoke test deployed app
        shell: bash
        run: |
          public_url="${RAILWAY_PUBLIC_URL%/}"
          curl --fail --show-error --silent --retry 30 --retry-delay 10 --retry-all-errors "$public_url/auth/login" > /dev/null
